name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # SECURITY (2026-11-06): this step used to hardcode the keystore password
      # and then commit the generated keystore into this PUBLIC repository.
      # The signing key has been rotated. The new keystore travels as a hex repo
      # secret and is written to the ephemeral runner only. It is never committed.
      - name: Materialise signing keystore from secret
        env:
          KEYSTORE_HEX: ${{ secrets.KEYSTORE_HEX }}
        run: |
          if [ -z "$KEYSTORE_HEX" ]; then
            echo "::error::KEYSTORE_HEX secret is missing, cannot sign the release build."
            exit 1
          fi
          printf '%s' "$KEYSTORE_HEX" | xxd -r -p > keystore.jks
          test -s keystore.jks || { echo "::error::keystore decode produced an empty file"; exit 1; }
          echo "keystore materialised: $(wc -c < keystore.jks) bytes"

      - name: Build release APK
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamic-reminder-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Copy APK to friendly name
        run: cp app/build/outputs/apk/release/app-release.apk IslamicReminder-1.0.apk

      - name: Upload APK (direct file)
        uses: actions/upload-artifact@v4
        with:
          name: IslamicReminder-APK
          path: IslamicReminder-1.0.apk
          retention-days: 90
